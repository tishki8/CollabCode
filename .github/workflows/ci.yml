name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: collabcode
          POSTGRES_PASSWORD: collabcode
          POSTGRES_DB: collabcode
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U collabcode" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://collabcode:collabcode@localhost:5432/collabcode
      REDIS_URL: redis://localhost:6379 # lets the collab tests also cover cross-instance sync
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Apply migrations (needed by the API and collab integration tests)
        run: pnpm --filter @collabcode/db exec prisma migrate deploy
      - run: pnpm test

  # Two real browsers editing the same file through a share link (see apps/web/e2e).
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: collabcode
          POSTGRES_PASSWORD: collabcode
          POSTGRES_DB: collabcode
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U collabcode" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://collabcode:collabcode@localhost:5432/collabcode
      REDIS_URL: redis://localhost:6379
      DEV_LOGIN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @collabcode/db exec prisma migrate deploy
      - run: pnpm db:seed
      - name: Install Playwright browser
        run: pnpm --filter @collabcode/web exec playwright install --with-deps chromium
      - name: Run end-to-end tests (Playwright starts collab, api and web)
        run: pnpm --filter @collabcode/web exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/test-results
            apps/web/playwright-report
          retention-days: 7
