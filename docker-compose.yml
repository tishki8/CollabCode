# Local development stack: `docker compose up --build`
# Open http://localhost:3000 and use the "Development login" links (seeded demo users).
x-node: &node
  build:
    context: .
    dockerfile: docker/node.Dockerfile
  env_file:
    - path: .env
      required: false
  restart: unless-stopped

# Shared by api (signs collab tokens) and collab (verifies them). Override in .env for anything
# beyond local development; must be at least 32 characters.
x-collab-secret: &collab-secret
  COLLAB_JWT_SECRET: ${COLLAB_JWT_SECRET:-dev-only-collab-secret-change-me-please-0123456789}

x-db-env: &db-env
  DATABASE_URL: postgresql://collabcode:collabcode@postgres:5432/collabcode
  REDIS_URL: redis://redis:6379

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: collabcode
      POSTGRES_PASSWORD: collabcode
      POSTGRES_DB: collabcode
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collabcode"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: apply migrations, then seed the demo users/project (idempotent).
  migrate:
    <<: *node
    restart: "no"
    environment: { <<: *db-env }
    command: sh -c "pnpm --filter @collabcode/db exec prisma migrate deploy && pnpm db:seed"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *node
    environment:
      <<: [*db-env, *collab-secret]
      API_PORT: "4000"
      # The browser reaches the API through the web app's proxy: trust exactly that one hop so
      # rate limits use each visitor's real address. Do NOT publish the API port in production.
      TRUST_PROXY_HOPS: "1"
      WEB_ORIGIN: http://localhost:3000
      # The collab server as the BROWSER reaches it (published port on the host).
      COLLAB_PUBLIC_URL: ${COLLAB_PUBLIC_URL:-ws://localhost:1234}
      # The collab server as the API reaches it on the compose network: used for the signed
      # /internal calls (accept a suggestion, restore a checkpoint). Not exposed to browsers.
      COLLAB_INTERNAL_URL: http://collab:1234
    command: pnpm --filter @collabcode/api start
    ports: ["4000:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    <<: *node
    environment:
      <<: *db-env
      API_URL: http://api:4000
      AUTH_URL: http://localhost:3000
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-secret-change-me}
      DEV_LOGIN: ${DEV_LOGIN:-true}
    command: pnpm --filter @collabcode/web dev
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Real-time collaboration (Hocuspocus/Yjs). Scale horizontally by running more instances:
  # they sync through Redis.
  collab:
    <<: *node
    environment:
      <<: [*db-env, *collab-secret]
      PORT: "1234"
    command: pnpm --filter @collabcode/collab start
    ports: ["1234:1234"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  # Placeholder until Phase 6.
  runner:
    <<: *node
    environment: { <<: *db-env, PORT: "5000" }
    command: pnpm --filter @collabcode/runner start
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
